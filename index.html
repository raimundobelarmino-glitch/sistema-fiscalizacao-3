<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Fiscalização de Trânsito</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <text y='0.9em' font-size='90'>🚦</text>
    </svg>">
</head>

<body>

<header>
    <h1>Sistema de Fiscalização de Trânsito</h1>
    <p>Selecione uma opção para continuar</p>
</header>

<main class="home-menu">

    <a href="cadastro.html" class="menu-button">
        <h2>Cadastro</h2>
        <p>Iniciar, continuar ou finalizar o registro de uma operação.</p>
    </a>

    <a href="relatorios-menu.html" class="menu-button">
        <h2>Relatórios</h2>
        <p>Visualizar dashboards, estatísticas e relatórios detalhados.</p>
    </a>

    <a href="estatisticas.html" class="menu-button">
        <h2>Estatísticas Avançadas</h2>
        <p>Analisar dados com gráficos interativos e detalhados.</p>
    </a>

</main>

<div class="footer-actions">
    <button id="load-data-btn" class="secondary">
        Carregar Dados de Teste Massivos
    </button>

    <button id="load-creative-data-btn" class="secondary">
        Carregar Dados de Teste Criativos (500)
    </button>

    <button id="clear-data-btn" class="danger-button">
        Limpar Todos os Dados para Teste
    </button>
</div>

<!-- 🔵 BOTÃO -->
<button id="btnSalvarFirebase"
    style="margin:25px;padding:15px 25px;font-size:16px;
    background:#0d6efd;color:white;border:none;border-radius:8px;cursor:pointer;">
    SALVAR TESTE NO FIREBASE
</button>

<!-- 🔥 FIREBASE + FUNÇÃO (UM BLOCO SÓ) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArXUzKUn0qCRLY98kxf2c9YB5BEXJzLTI",
        authDomain: "sistema-fiscalizacao-3.firebaseapp.com",
        projectId: "sistema-fiscalizacao-3",
        storageBucket: "sistema-fiscalizacao-3.firebasestorage.app",
        messagingSenderId: "994230988259",
        appId: "1:994230988259:web:cd0afe7620ba1eb1784d6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("btnSalvarFirebase").addEventListener("click", async () => {
        try {
            await addDoc(collection(db, "teste"), {
                mensagem: "Teste salvo pelo botão",
                criadoEm: new Date()
            });

            alert("✅ SALVO COM SUCESSO NO FIRESTORE");
            console.log("Documento salvo no Firestore");

        } catch (e) {
            console.error("ERRO:", e);
            alert("❌ ERRO AO SALVAR (veja o console)");
        }
    });
</script>

<script>
    document.getElementById('clear-data-btn')?.addEventListener('click', () => {
        if (confirm('Tem certeza de que deseja apagar TODOS os dados salvos?')) {
            localStorage.clear();
            alert('Dados apagados.');
        }
    });
</script>

</body>
</html>
