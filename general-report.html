<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Geral</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/table-to-excel/dist/tableToExcel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="general-report.js" defer></script>
</head>
<body>
    <header>
        <h1>Relatório Geral</h1>
        <p>Resumo consolidado das operações finalizadas.</p>
    </header>
    <main>
        <div class="report-container">
             <fieldset>
                <legend>Filtros</legend>
                <div id="filters">
                    <div class="filter-group">
                        <label for="filter-start-date">De:</label>
                        <input type="date" id="filter-start-date">
                    </div>
                    <div class="filter-group">
                        <label for="filter-end-date">Até:</label>
                        <input type="date" id="filter-end-date">
                    </div>
                    <div class="filter-group">
                         <label for="filter-regional">Regional:</label>
                        <select id="filter-regional">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-operation">Operação:</label>
                        <select id="filter-operation">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-municipio">Município/Distrito:</label>
                        <select id="filter-municipio">
                            <option value="">Todos</option>
                        </select>
                    </div>
                     <div class="filter-buttons">
                        <button type="button" id="apply-filters-btn">Gerar Relatório</button>
                        <button type="button" id="clear-filters-btn" class="secondary">Limpar Filtros</button>
                    </div>
                </div>
            </fieldset>

            <section id="general-report-section" class="report-section">
                <h2>Resumo Geral</h2>
                <div id="report-content">
                    <p>Aplique os filtros para gerar o relatório.</p>
                </div>
                 <div class="report-card-actions" style="margin-top: 1rem; justify-content: flex-start;">
                    <button id="copy-report-btn" class="secondary hidden">Copiar Texto</button>
                    <button id="export-pdf-btn" class="secondary hidden">Exportar PDF</button>
                    <button id="export-excel-btn" class="secondary hidden">Exportar Excel</button>
                    <button id="share-whatsapp-btn" class="secondary hidden">Compartilhar no WhatsApp</button>
                </div>
            </section>
        </div>
    </main>
    <div class="footer-nav">
         <a href="index.html" class="back-link-bottom">&larr; Voltar para o Início</a>
    </div>
</body>
</html>
